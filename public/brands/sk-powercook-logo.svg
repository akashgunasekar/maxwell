<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 84" width="100%" height="100%" fill="none">
  <!-- Symbol: Navy Industrial Engine Monogram with Orange/Red Thermal Flame Accent -->
  <g transform="translate(6, 6)">

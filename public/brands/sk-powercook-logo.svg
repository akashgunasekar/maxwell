    </text>
    
    <!-- MACHINERY badge -->
    <rect x="272" y="11" width="94" height="22" rx="4" fill="#0284C7" />
    <text x="319" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="2" fill="#FFFFFF">
      MACHINERY
    </text>

    <!-- Subtitle: Engineered Solutions for Commercial Food Processing -->
    <text x="1" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="1.2" fill="#475569">
